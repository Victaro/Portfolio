<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Victor Ploeger - Projects</title>
  <meta name="description" content="Project portfolio of Victor Ploeger." />
  <link rel="icon" type="image/png" href="assets/dot.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap">
		<a class="site-name" href="index.html">Victor Ploeger<span class="dot">.</span></a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="projects.html" aria-current="page">Projects</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="page-intro">
        <h1>Projects</h1>
        <p>This page covers taken courses, projects, and personal work and achievements.<br /> <span class="highlight">Click any project for more details</span> or <span class="highlight">filter using the tags</span> below.</p>
      </section>

      <div class="filter-bar" id="filter-bar">
        <!-- Filled in automatically from the tags in js/projects-data.js -->
      </div>

      <div class="project-list" id="project-list">
        <!-- Filled in automatically from js/projects-data.js -->
      </div>
      <p class="empty-state" id="empty-state" style="display:none;">No projects match this filter yet.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; 2026 Victor Ploeger</span>
      <a href="https://www.linkedin.com/in/victorploeger" target="_blank" rel="noopener">LinkedIn &rsaquo;</a>
    </div>
  </footer>

  <dialog class="project-dialog" id="project-dialog">
    <div class="dialog-inner">
      <button class="dialog-close" id="dialog-close" type="button" aria-label="Close">&times;</button>
      <div id="dialog-gallery"></div>
      <div class="dialog-meta" id="dialog-meta"></div>
      <h2 class="dialog-title" id="dialog-title"></h2>
      <span class="dialog-role" id="dialog-role"></span>
      <div class="dialog-body" id="dialog-body"></div>
      <div class="tags dialog-tags" id="dialog-tags"></div>
      <div class="dialog-links" id="dialog-links"></div>
    </div>
  </dialog>
  <dialog class="lightbox" id="lightbox">
  <button class="dialog-close" id="lightbox-close" type="button" aria-label="Close">&times;</button>
  <img id="lightbox-img" src="" alt="" />
</dialog>

  <script src="js/projects-data.js"></script>
  <script src="js/render.js"></script>
</body>
</html>
